[project]
name = "ethswarm-chain-sync"
dynamic = ["version"]
description = "Sync Swarm storage-incentives contract events into a local JSONLines cache"
readme = "docs/data-model.md"
requires-python = ">=3.11"
dependencies = [
    "eth-abi>=5",
    "eth-hash[pycryptodome]>=0.7",
    "ethswarm-deployments",
    "requests>=2.31",
]

[project.scripts]
ethswarm-chain-sync = "ethswarm_chain_sync.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/ethswarm_chain_sync"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
